<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MediaVault">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>MediaVault</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --bad:#e66; --acc:#4af; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  [hidden] { display:none !important; }
  section { padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  input, button { font:inherit; width:100%; padding:12px; margin:4px 0; border-radius:8px; border:1px solid #444; background:#222; color:var(--fg); }
  .check { display:flex; align-items:center; gap:8px; margin:4px 0; color:var(--mut); }
  .check input { width:auto; margin:0; }
  .folder { display:flex; justify-content:space-between; gap:8px; text-align:left; background:#222; color:var(--fg); font-weight:400; }
  .folder span { color:var(--mut); white-space:nowrap; }
  button { background:var(--acc); color:#000; border:0; font-weight:600; }
  button.sec { background:#333; color:var(--fg); }
  .msg { color:var(--bad); min-height:1.4em; }
  .mut { color:var(--mut); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; position:sticky; top:0; background:var(--bg); z-index:1; }
  header button { width:auto; margin:0; padding:8px 12px; }
  header button:disabled { opacity:.5; }
  header .sp { flex:1; }
  .tabs { display:flex; gap:8px; width:100%; }
  .tabs [role="tab"] { flex:1; background:#222; color:var(--mut); font-weight:400; }
  .tabs [role="tab"][aria-selected="true"] { background:var(--fg); color:#000; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; }
  .tile { all:unset; position:relative; aspect-ratio:1; background:#222; overflow:hidden; display:block; cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:4px; text-align:center; font-size:12px; color:var(--mut); word-break:break-all; overflow:hidden; }
  .tile .ph b { font-size:28px; color:var(--fg); }
  #viewer { position:fixed; inset:0; padding-bottom:env(safe-area-inset-bottom); background:#000; z-index:10; display:flex; align-items:center; justify-content:center; }
  #viewer img, #viewer video { width:100%; height:100%; object-fit:contain; }
  #close { position:absolute; top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right));
    width:44px; height:44px; padding:0; border-radius:22px; font-size:20px; z-index:2;
    background:rgba(0,0,0,.45); color:#fff; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  #vbar { position:absolute; left:0; right:0; bottom:0; z-index:2; color:#fff;
    padding:32px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  #vbar .row { display:flex; align-items:center; gap:10px; }
  #vbar .row + .row { justify-content:center; gap:28px; margin-top:4px; }
  #vbar span { font-size:13px; font-variant-numeric:tabular-nums; min-width:3.2em; }
  #vbar span:last-child { text-align:right; }
  #vbar button { width:44px; height:44px; padding:0; margin:0; border-radius:22px; background:none; color:#fff; font-weight:400; font-size:15px; }
  #vplay { font-size:26px !important; }
  #loop { font-size:22px !important; color:rgba(255,255,255,.55) !important; position:absolute; right:max(16px, env(safe-area-inset-right)); }
  #loop[aria-pressed="true"] { color:var(--acc) !important; }
  #vseek { flex:1; width:auto; margin:0; padding:0; height:28px; border:0; background:none; -webkit-appearance:none; appearance:none; }
  #vseek::-webkit-slider-runnable-track { height:4px; border-radius:2px;
    background:linear-gradient(to right, #fff var(--p, 0%), rgba(255,255,255,.35) var(--p, 0%)); }
  #vseek::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; margin-top:-6px; border-radius:8px; background:#fff; }
  #close, #vbar { transition:opacity .25s; }
  #viewer.idle #close, #viewer.idle #vbar { opacity:0; pointer-events:none; }
  #vprog { position:absolute; left:0; right:0; bottom:0; height:4px; width:100%; appearance:none; border:0; background:#333; }
  #vprog::-webkit-progress-bar { background:#333; }
  #vprog::-webkit-progress-value { background:#eee; }
  #vprog::-moz-progress-bar { background:#eee; }
  #uprog { display:block; width:100%; height:4px; appearance:none; border:0; background:#333; }
  #uprog::-webkit-progress-bar { background:#333; }
  #uprog::-webkit-progress-value { background:#eee; }
  #uprog::-moz-progress-bar { background:#eee; }
  #vmsg { position:absolute; color:var(--bad); padding:16px; text-align:center; }
</style>
</head>
<body>
<section id="s-start" class="mut">Lade …</section>
<section id="s-offline" hidden>
  <p>Keine Verbindung.</p>
  <p class="msg" id="offline-msg"></p>
  <button id="retry">Erneut versuchen</button>
  <button id="offline-logout" class="sec">Abmelden</button>
</section>
<section id="s-login" hidden>
  <h1>MediaVault</h1>
  <form id="login-form">
    <input id="email" type="email" placeholder="E-Mail" autocomplete="username" required>
    <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <label class="check"><input id="show-pw" type="checkbox"> Passwort anzeigen</label>
    <input id="code" type="text" inputmode="numeric" placeholder="2FA-Code (optional)" autocomplete="one-time-code">
    <button type="submit">Anmelden</button>
  </form>
  <p class="msg" id="login-msg"></p>
</section>
<section id="s-folder" hidden>
  <h1>Ordner wählen</h1>
  <div id="folder-list"></div>
</section>
<section id="s-lib" hidden style="padding:0">
  <header>
    <button id="sort" class="sec" aria-label="Sortierung umschalten"></button>
    <span class="sp"></span>
    <button id="upload">Hochladen</button>
    <button id="logout" class="sec">Abmelden</button>
    <div class="tabs" role="tablist">
      <button id="tab-image" role="tab">Bilder</button>
      <button id="tab-video" role="tab">Videos</button>
      <button id="change-folder" class="sec">Ordner</button>
    </div>
  </header>
  <progress id="uprog" max="1" value="0" hidden></progress>
  <p id="up-msg" class="mut" style="padding:0 16px" hidden></p>
  <input id="pick" type="file" accept="image/*,video/*" multiple hidden>
  <p id="lib-msg" class="mut" style="padding:0 16px" hidden></p>
  <div class="grid" id="grid"></div>
</section>
<div id="viewer" hidden>
  <button id="close" aria-label="Schließen">✕</button>
  <div id="vbar" hidden>
    <div class="row"><span id="vtime">0:00</span><input id="vseek" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="vdur">0:00</span></div>
    <div class="row">
      <button id="vback" aria-label="10 Sekunden zurück">−10</button>
      <button id="vplay" aria-label="Abspielen">▶&#xFE0E;</button>
      <button id="vfwd" aria-label="10 Sekunden vor">+10</button>
      <button id="loop" aria-pressed="false" aria-label="Wiederholen">↻</button>
    </div>
  </div>
  <div id="vmedia" style="display:contents"></div>
  <progress id="vprog" max="1" value="0"></progress>
  <p id="vmsg" hidden></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
