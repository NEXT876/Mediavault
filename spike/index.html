<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MV Spike">
<link rel="manifest" href="manifest.json">
<title>MediaVault Spike</title>
<!-- Wegwerf-Test für Issue #21: läuft megajs in iOS Safari, und wie viel Speicher bekommt eine PWA? -->
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --ok:#3c3; --bad:#e44; --acc:#4af; }
  body { margin:0; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.mut, .mut { color:var(--mut); font-size:14px; }
  input, button { font:inherit; width:100%; box-sizing:border-box; padding:12px; margin:4px 0; border-radius:8px; border:1px solid #444; background:#222; color:var(--fg); }
  button { background:var(--acc); color:#000; border:0; font-weight:600; }
  button:disabled { opacity:.4; }
  button.sec { background:#333; color:var(--fg); }
  ul { list-style:none; padding:0; margin:12px 0; }
  li { padding:8px 0; border-bottom:1px solid #2a2a2a; }
  li .d { color:var(--mut); font-size:13px; word-break:break-word; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:8px 0; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; background:#222; }
  video { width:100%; background:#000; margin:8px 0; }
  pre { white-space:pre-wrap; font-size:12px; background:#1a1a1a; padding:8px; border-radius:8px; }
</style>
</head>
<body>
<h1>MediaVault Spike</h1>
<p class="mut">Testet MEGA im Browser, Video-Spulen und Speicher. Zugangsdaten bleiben auf diesem Gerät.</p>

<div id="prev" class="mut"></div>

<form id="login">
  <input id="email" type="email" placeholder="MEGA E-Mail" autocomplete="username" required>
  <input id="pw" type="password" placeholder="MEGA Passwort" autocomplete="current-password" required>
  <input id="tfa" inputmode="numeric" placeholder="2FA-Code (nur falls aktiv)">
  <input id="folder" value="mediavault-test" placeholder="Ordnername">
  <button id="go">Alle Tests starten</button>
</form>
<button id="resume" class="sec" hidden>Mit gespeicherter Sitzung starten (ohne Passwort)</button>

<ul id="res"></ul>
<div class="grid" id="imgs"></div>
<div id="vids"></div>
<button id="copy" class="sec" hidden>Bericht kopieren</button>
<pre id="report" hidden></pre>

<script type="module">
import { Storage } from 'https://cdn.jsdelivr.net/npm/megajs@1.3.9/dist/main.browser-es.mjs'

const $ = id => document.getElementById(id)
const CACHE = 'mv-spike'
const SESSION_KEY = 'mv-spike-session'
const RUN_KEY = 'mv-spike-lastrun'
const lines = []
const MB = n => (n / 1048576).toFixed(1) + ' MB'
const ms = t0 => Math.round(performance.now() - t0) + ' ms'
const VIDEO = { mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' }
const IMAGE = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', heic: 'image/heic' }
const ext = n => n.split('.').pop().toLowerCase()

function row (name, ok, detail = '') {
  const icon = ok === null ? 'ℹ️' : ok ? '✅' : '❌'
  const li = document.createElement('li')
  li.innerHTML = `${icon} <b></b><div class="d"></div>`
  li.querySelector('b').textContent = name
  li.querySelector('.d').textContent = detail
  $('res').append(li)
  lines.push(`${icon} ${name}${detail ? ' — ' + detail : ''}`)
}

// Führt einen Test aus; ein Fehler bricht nur diesen Test ab, nicht den ganzen Lauf.
async function test (name, fn) {
  try {
    const r = await fn()
    // Nur {ok, detail}-Ergebnisse werden als Zeile gezeigt; andere Rückgabewerte (Storage, Buffer) sind Daten.
    if (r && typeof r === 'object' && 'detail' in r) row(name, r.ok ?? true, r.detail)
    return r
  } catch (e) {
    row(name, false, `${e?.name || 'Fehler'}: ${e?.message || e}`)
  }
}

function eq (a, b) {
  if (a.length !== b.length) return false
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false
  return true
}

// Lädt das Video als Blob in ein <video>, springt in die Mitte und wartet auf "seeked".
function seekTest (blob, label) {
  return new Promise(resolve => {
    const v = document.createElement('video')
    v.controls = true; v.playsInline = true; v.muted = true; v.preload = 'auto'
    v.src = URL.createObjectURL(blob)
    const cap = document.createElement('div'); cap.className = 'mut'; cap.textContent = label + ' (manuell: abspielen und spulen probieren)'
    $('vids').append(cap, v)
    const t = setTimeout(() => resolve({ ok: false, detail: 'Timeout 20 s (keine Metadaten / kein seeked)' }), 20000)
    v.onerror = () => { clearTimeout(t); resolve({ ok: false, detail: 'video error ' + (v.error?.code ?? '?') }) }
    v.onloadedmetadata = () => {
      const target = v.duration / 2
      const t0 = performance.now()
      v.onseeked = () => { clearTimeout(t); resolve({ ok: true, detail: `Dauer ${v.duration.toFixed(1)} s, Sprung auf ${target.toFixed(1)} s in ${ms(t0)}` }) }
      v.currentTime = target
    }
    v.load()
  })
}

async function storageInfo (label) {
  const est = await navigator.storage?.estimate?.()
  if (!est) return { ok: false, detail: 'navigator.storage.estimate fehlt' }
  return { ok: null, detail: `${label}: belegt ${MB(est.usage)}, Quota ${MB(est.quota)}` }
}

async function run (storage, fromSession) {
  $('res').innerHTML = ''; $('imgs').innerHTML = ''; $('vids').innerHTML = ''; lines.length = 0
  lines.push(`MediaVault Spike ${new Date().toISOString()}`, navigator.userAgent)

  await test('Installiert (Homescreen-Modus)', () => {
    const sa = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
    return { ok: sa, detail: sa ? 'läuft als PWA' : 'läuft im Safari-Tab: für den Speichertest bitte über den Homescreen starten' }
  })

  if (!storage) {
    storage = await test('Login bei MEGA', async () => {
      const t0 = performance.now()
      const opts = { email: $('email').value.trim(), password: $('pw').value }
      if ($('tfa').value.trim()) opts.secondFactorCode = $('tfa').value.trim()
      const s = await new Storage(opts).ready
      row('Login bei MEGA', true, `${ms(t0)}, ${Object.keys(s.files).length} Knoten geladen`)
      return s
    })
    $('pw').value = ''
    if (!storage) return finish()
  } else {
    const ok = await test('Login mit gespeicherter Sitzung', async () => {
      const t0 = performance.now()
      await storage.reload(true)
      row('Login mit gespeicherter Sitzung', true, `${ms(t0)}, ohne Passwort, ${Object.keys(storage.files).length} Knoten`)
      return true
    })
    if (!ok) return finish()
  }

  await test('Konto / Transferlimit', async () => {
    const a = await storage.getAccountInfo()
    return { ok: null, detail: `Typ ${a.type}, Speicher ${MB(a.spaceUsed)} / ${MB(a.spaceTotal)}, Download-Transfer ${MB(a.downloadBandwidthUsed)} / ${a.downloadBandwidthTotal ? MB(a.downloadBandwidthTotal) : 'keine Angabe (Gratis: dynamisch)'}` }
  })

  const folderName = $('folder').value.trim()
  const folder = storage.root.children?.find(f => f.directory && f.name === folderName) || storage.find(f => f.directory && f.name === folderName, true)
  if (!folder) { row(`Ordner „${folderName}“`, false, 'nicht gefunden'); return finish(storage) }
  const files = (folder.children || []).filter(f => !f.directory)
  const imgs = files.filter(f => IMAGE[ext(f.name)])
  const vids = files.filter(f => VIDEO[ext(f.name)]).sort((a, b) => a.size - b.size)
  row(`Ordner „${folderName}“`, true, `${files.length} Dateien: ${imgs.length} Bilder, ${vids.length} Videos`)

  await test('Speicher vorher', () => storageInfo('vorher'))

  for (const f of imgs) {
    await test(`Bild ${f.name}`, async () => {
      const t0 = performance.now()
      const buf = await f.downloadBuffer({})
      const dl = ms(t0)
      const blob = new Blob([buf], { type: IMAGE[ext(f.name)] })
      const img = new Image(); img.src = URL.createObjectURL(blob)
      $('imgs').append(img)
      await img.decode()
      return { detail: `${MB(f.size)}, Download+Entschlüsseln ${dl}, ${img.naturalWidth}×${img.naturalHeight}` }
    })
  }

  const cache = await caches.open(CACHE).catch(() => null)
  let cached = 0
  for (const [i, f] of vids.entries()) {
    const label = i === vids.length - 1 && vids.length > 1 ? 'großes Video' : 'Video'
    const buf = await test(`${label} ${f.name}: Download`, async () => {
      const t0 = performance.now()
      const b = await f.downloadBuffer({})
      const s = (performance.now() - t0) / 1000
      row(`${label} ${f.name}: Download`, true, `${MB(f.size)} in ${s.toFixed(1)} s (${(f.size / 1048576 / s).toFixed(1)} MB/s)`)
      return b
    })
    if (!buf) continue
    const blob = new Blob([buf], { type: VIDEO[ext(f.name)] })
    await test(`${label} ${f.name}: Spulen`, () => seekTest(blob, f.name))

    // Teil-Download ist die Grundlage für Streaming ohne kompletten Download.
    if (i === 0) {
      await test('Teil-Download (Range) entschlüsselt korrekt', async () => {
        const start = Math.floor(f.size / 3), end = Math.min(f.size - 1, start + 262143)
        const part = await f.downloadBuffer({ start, end })
        const incl = eq(part, buf.subarray(start, end + 1)), excl = eq(part, buf.subarray(start, end))
        return { ok: incl || excl, detail: `Bytes ${start}–${end}, ${part.length} B, ${incl ? 'end inklusiv' : excl ? 'end exklusiv' : 'stimmt NICHT'}` }
      })
    }

    if (cache) {
      await test(`${label} ${f.name}: im Cache gespeichert`, async () => {
        const key = './__cache/' + encodeURIComponent(f.name)
        await cache.put(key, new Response(blob, { headers: { 'content-type': blob.type } }))
        const back = await (await cache.match(key)).blob()
        cached++
        return { ok: back.size === blob.size, detail: `${MB(back.size)} zurückgelesen` }
      })
    }
  }
  if (!cache) row('Cache Storage', false, 'caches.open nicht verfügbar')

  await test('Speicher nachher', () => storageInfo('nachher'))
  await test('Dauerhafter Speicher (persist)', async () => {
    if (!navigator.storage?.persist) return { ok: false, detail: 'navigator.storage.persist fehlt' }
    const granted = await navigator.storage.persist()
    return { ok: granted, detail: granted ? 'gewährt' : 'abgelehnt: iOS darf den Speicher bei Platzmangel oder nach Nichtnutzung löschen' }
  })

  await test('Upload + Wiederlesen + Löschen', async () => {
    const body = JSON.stringify({ test: 'mv-spike', at: new Date().toISOString(), ratings: { 'example-uuid': 4 } })
    const t0 = performance.now()
    const up = await folder.upload({ name: 'mv-spike-ratings-test.json' }, body).complete
    const back = new TextDecoder().decode(await up.downloadBuffer({}))
    await up.delete(true)
    return { ok: back === body, detail: `${ms(t0)} für hoch, runter, löschen` }
  })

  if (!fromSession) {
    await test('Sitzung speichern (ohne Passwort)', async () => {
      const j = storage.toJSON()
      j.options = { email: j.options.email } // Passwort nie speichern
      localStorage.setItem(SESSION_KEY, JSON.stringify(j))
      return { detail: 'nächster Start: „Mit gespeicherter Sitzung starten“ testen' }
    })
  }

  localStorage.setItem(RUN_KEY, JSON.stringify({ at: new Date().toISOString(), cached }))
  finish(storage)
}

function finish () {
  $('report').textContent = lines.join('\n')
  $('report').hidden = false
  $('copy').hidden = false
  $('go').disabled = false; $('resume').disabled = false
}

// Beim Öffnen: ist der Cache vom letzten Lauf noch da? (Persistenz über Tage)
;(async () => {
  try {
    const last = JSON.parse(localStorage.getItem(RUN_KEY) || 'null')
    if (last) {
      const keys = await (await caches.open(CACHE)).keys()
      const days = ((Date.now() - Date.parse(last.at)) / 864e5).toFixed(1)
      $('prev').textContent = `Letzter Lauf vor ${days} Tagen: ${last.cached} Videos gecacht, jetzt noch ${keys.length} im Cache.`
    }
    if (localStorage.getItem(SESSION_KEY)) $('resume').hidden = false
  } catch (e) { $('prev').textContent = 'Speicher nicht lesbar: ' + e.message }
})()

$('login').onsubmit = e => { e.preventDefault(); $('go').disabled = true; run(null, false) }
$('resume').onclick = () => {
  $('resume').disabled = true
  const s = Storage.fromJSON(JSON.parse(localStorage.getItem(SESSION_KEY)))
  run(s, true)
}
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('report').textContent); $('copy').textContent = 'Kopiert ✓' }
  catch { $('copy').textContent = 'Kopieren ging nicht, bitte Text unten markieren' }
}
</script>
</body>
</html>
